<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Conversor de Moedas</title>
</head>

<body>
    <img class="logo" src="./assets/logo.png" alt="logo-gif">

    <main>
        <div class="header-card">
            <h1>Conversor de moedas</h1>
        </div>

        <label>
            Converter <b>de</b>
            <select class="currency-from-select">
                <option value="brl">R$ Real Brasileiro</option>
                <option value="usd">US$ Dólar Americano</option>
                <option value="eur">€ Euro</option>
                <option value="gbp">£ Libra Esterlina</option>
                <option value="jpy">¥ Iene Japonês</option>
                <option value="cad">C$ Dólar Canadense</option>
                <option value="chf">CHF Franco Suíço</option>
                <option value="aud">A$ Dólar Australiano</option>
                <option value="btc">₿ Bitcoin</option>
                
            </select>
        </label>


        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="usd">US$ Dólar Americano</option>
                <option value="eur">€ Euro</option>
                <option value="brl">R$ Real Brasileiro</option>
                <option value="gbp">£ Libra Esterlina</option>
                <option value="jpy">¥ Iene Japonês</option>
                <option value="cad">C$ Dólar Canadense</option>
                <option value="chf">CHF Franco Suíço</option>
                <option value="aud">A$ Dólar Australiano</option>
                <option value="btc">₿ Bitcoin</option>
            </select>
        </label>

        <label>
            Valor

            <input class="input-currency" placeholder="R$ 10.000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <div class="currency-flag" id="from-flag">R$</div>
                <p class="currency" id="from-currency-name">Real Brasileiro</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="./assets/arrow.png" alt="seta">

            <div class="currency-box">
                <div class="currency-flag" id="to-flag">US$</div>
                <p class="currency" id="currency-name">Dólar Americano</p>
                <p class="currency-value">US$ 0,00</p>
            </div>

        </section>
    </main>
</body>

<script src="./main.js"></script>

</html>
